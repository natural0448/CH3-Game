<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>마을 준비 중 · 작은 마을</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 24px 16px;
            background: #f4f2e9;
            color: #263d32;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            line-height: 1.6;
        }

        .village-card {
            width: 100%;
            max-width: 580px;
            min-width: 0;
            padding: clamp(24px, 6vw, 40px);
            border: 1px solid #dedfd3;
            border-radius: 24px;
            background: #fffef9;
            box-shadow: 0 16px 48px #263d3210;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 24px;
        }

        .village-mark {
            display: grid;
            place-items: center;
            width: 52px;
            height: 52px;
            flex-shrink: 0;
            border-radius: 16px;
            background: #e7eee0;
            color: #356449;
            font-size: 36px;
            line-height: 1;
        }

        .connection-status {
            padding: 6px 12px;
            border-radius: 20px;
            background: #edf2e7;
            color: #356449;
            font-size: 13px;
            font-weight: 600;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(26px, 6vw, 34px);
            line-height: 1.3;
            letter-spacing: -0.04em;
            word-break: keep-all;
            overflow-wrap: anywhere;
        }

        .greeting {
            margin: 0;
            color: #657066;
            overflow-wrap: anywhere;
        }

        .greeting strong {
            color: #263d32;
        }

        .room {
            display: grid;
            gap: 4px;
            margin: 28px 0;
            padding: 18px 20px;
            border: 1px solid #e0e4d8;
            border-radius: 14px;
            background: #f6f7ef;
            overflow-wrap: anywhere;
        }

        .room-label {
            color: #657066;
            font-size: 13px;
        }

        .room-name {
            font-size: 20px;
            font-weight: 700;
        }

        .actions {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 12px;
        }

        .actions form {
            margin: 0;
            min-width: 0;
        }

        .button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 48px;
            padding: 12px 16px;
            border: 1px solid #356449;
            border-radius: 10px;
            font: inherit;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }

        .button-primary {
            background: #356449;
            color: #fff;
        }

        .button-primary:hover {
            background: #294e39;
        }

        .button-secondary {
            background: #fffef9;
            color: #356449;
        }

        .button-secondary:hover {
            background: #edf2e7;
        }

        .button:focus-visible {
            outline: 3px solid #80a68b;
            outline-offset: 3px;
        }

        @media (max-width: 420px) {
            .actions {
                grid-template-columns: minmax(0, 1fr);
            }
        }
    </style>
</head>
<body>
    <main class="village-card" aria-labelledby="village-title">
        <div class="card-header">
            <div class="village-mark" aria-hidden="true">⌂</div>
            <span class="connection-status">접속 중</span>
        </div>

        <h1 id="village-title">마을 준비 중</h1>
        <p class="greeting"><strong>{{ user.get_username }}</strong>님, 반가워요.</p>

        <section class="room" aria-labelledby="room-label">
            <span class="room-label" id="room-label">현재 방</span>
            <span class="room-name">{{ user.player.room_id }}</span>
        </section>

        <div class="actions">
            <a class="button button-primary" href="{% url 'game:player' %}">내 상태 조회</a>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button class="button button-secondary" type="submit">로그아웃</button>
            </form>
        </div>
    </main>
</body>
</html>
