<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>작은 마을 입장</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 24px 16px;
            background: #f4f2e9;
            color: #263d32;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            line-height: 1.6;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            min-width: 0;
            padding: clamp(24px, 6vw, 36px);
            border: 1px solid #dedfd3;
            border-radius: 24px;
            background: #fffef9;
            box-shadow: 0 16px 48px #263d3210;
        }

        .village-mark {
            display: grid;
            place-items: center;
            width: 52px;
            height: 52px;
            margin-bottom: 20px;
            border-radius: 16px;
            background: #e7eee0;
            color: #356449;
            font-size: 36px;
            line-height: 1;
        }

        h1 {
            margin: 0;
            font-size: clamp(24px, 6vw, 30px);
            line-height: 1.3;
            letter-spacing: -0.04em;
            word-break: keep-all;
            overflow-wrap: anywhere;
        }

        .intro {
            margin: 12px 0 28px;
            color: #657066;
            font-size: 14px;
            word-break: keep-all;
            overflow-wrap: anywhere;
        }

        form p {
            display: grid;
            gap: 8px;
            margin: 0 0 18px;
            min-width: 0;
        }

        label {
            font-size: 14px;
            font-weight: 600;
        }

        input:not([type="hidden"]) {
            width: 100%;
            min-width: 0;
            max-width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd1c5;
            border-radius: 10px;
            background: #fff;
            color: #263d32;
            font: inherit;
            font-size: 16px;
        }

        input:focus-visible,
        button:focus-visible {
            outline: 3px solid #80a68b;
            outline-offset: 3px;
        }

        input[aria-invalid="true"] {
            border-color: #b54c40;
        }

        .helptext {
            color: #657066;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        .errorlist {
            margin: 0 0 12px;
            padding: 12px 14px;
            border: 1px solid #ebc6c0;
            border-radius: 10px;
            background: #fff2ef;
            color: #963b30;
            font-size: 14px;
            list-style: none;
            overflow-wrap: anywhere;
        }

        .errorlist li + li {
            margin-top: 6px;
        }

        button {
            display: block;
            width: 100%;
            min-height: 48px;
            margin-top: 8px;
            padding: 12px 16px;
            border: 0;
            border-radius: 10px;
            background: #356449;
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #294e39;
        }
    </style>
</head>
<body>
    <main class="login-card" aria-labelledby="login-title">
        <div class="village-mark" aria-hidden="true">⌂</div>
        <h1 id="login-title">작은 마을 입장</h1>
        <p class="intro">계정으로 로그인하고 마을에 들어오세요.</p>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}
            <button type="submit">로그인</button>
        </form>
    </main>
</body>
</html>
